name: hopcast_flutter
description: >-
  Hopcast device-to-device (D2D) file sharing for Flutter (Android + iOS). The
  proprietary core ships as hardened binaries bundled with this package
  (an Android AAR and an iOS XCFramework); consumers only see the thin, typed
  Dart/Kotlin/Swift glue.
version: 0.4.0
publish_to: none

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: fr.hopcast.flutter
        pluginClass: HopcastPlugin
      ios:
        pluginClass: HopcastPlugin
